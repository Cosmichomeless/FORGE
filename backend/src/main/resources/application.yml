spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
app:
  frontend-origin: ${APP_FRONTEND_ORIGIN:http://localhost:3000}
  invitation-ttl: ${APP_INVITATION_TTL:7d}
server:
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: ${COOKIE_SAME_SITE:lax}
management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
