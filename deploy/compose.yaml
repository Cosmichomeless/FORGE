# Local rehearsal of the production topology: HTTPS ingress -> frontend/backend -> private PostgreSQL.
# Secrets come from deploy/.env (generated by deploy.sh, git-ignored). Nothing is published except the proxy.
name: forge-prod-sim

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: forge
      POSTGRES_USER: forge_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?run deploy.sh}
      APP_DB_PASSWORD: ${DB_APP_PASSWORD:?run deploy.sh}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge_admin -d forge"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_URL: jdbc:postgresql://db:5432/forge
      DB_USER: forge_app
      DB_PASSWORD: ${DB_APP_PASSWORD:?run deploy.sh}
      APP_FRONTEND_ORIGIN: https://app.forge.localhost:8443
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: lax
      FORWARD_HEADERS_STRATEGY: framework
    networks: [internal]

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: https://api.forge.localhost:8443
    depends_on:
      backend: { condition: service_healthy }
    networks: [internal]

  proxy:
    image: caddy:2-alpine
    depends_on:
      frontend: { condition: service_healthy }
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [internal, edge]

networks:
  internal:
    internal: true
  edge: {}

volumes:
  pgdata:
  caddy_data:
